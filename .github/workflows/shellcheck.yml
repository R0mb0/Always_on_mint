name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in bin/aom lib/aom-common.sh lib/commands/*.sh install.sh uninstall.sh; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck -x -S warning bin/aom lib/aom-common.sh lib/commands/*.sh install.sh uninstall.sh
